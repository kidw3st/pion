name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # `_next/` starts with an underscore, which Pages' Jekyll layer would skip.
      - run: touch out/.nojekyll

      # Requires Pages to be switched on once by the repo owner:
      # Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
      # (Doing it from here needs a token with pages scope, which the default
      # workflow token doesn't carry.)
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
