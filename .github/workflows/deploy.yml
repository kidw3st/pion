name: Сборка и выкладка

# Каждый коммит в master собирается здесь и кладётся в ветку server-build:
# pion-site.tar.gz, pion-pay.tar.gz и build-info.json с их sha256. Сервер
# (pay/deploy.php по расписанию раз в 15 минут) сам забирает новую сборку.
# master — это то, что на сайте: незаконченная работа живёт в ветках.
#
# Работа разделена на две задачи. build собирает и проверяет: там запускаются
# npm, setup-php и весь чужой код, поэтому права на запись у неё нет. publish
# только забирает готовые файлы и кладёт их в server-build: токен с правом
# записи есть лишь в ней, а чужой код там не запускается.
#
# Публикации на GitHub Pages здесь нет и не будет: копия на github.io уже
# отбирала у pionperm.ru позиции в поиске. Прав pages у workflow нет.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Два коммита подряд — собирается последний: в нём есть всё. Группа своя у
# каждой ветки: ручной запуск из другой ветки не должен отменить сборку master.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ручной «Run workflow» из другой ветки иначе выложил бы эту ветку на боевой сайт.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Токен не остаётся в .git/config, и скрипты npm его не найдут.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # PHP — та же версия, что на хостинге.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: npm ci
      - run: npm test
      - run: find server-pay wp-theme -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/php/run.php

      # Боевая сборка. postbuild проверяет, что canonical, og, Schema и
      # sitemap указывают на pionperm.ru, и роняет сборку, если нет.
      - run: npm run build
        env:
          SITE_URL: https://pionperm.ru

      - run: node scripts/pack-build.mjs

      # Те же проверки, что у сервера: расхождение останавливает публикацию здесь.
      - run: php scripts/check-server-build.php build/pion-site.tar.gz build/pion-pay.tar.gz

      # Готовые файлы для publish. Нужны только до его запуска, поэтому через
      # три дня GitHub удалит их сам. overwrite — чтобы «Re-run all jobs» не
      # упиралась в артефакт прошлой попытки.
      - uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: |
            build/pion-site.tar.gz
            build/pion-pay.tar.gz
            build/build-info.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  publish:
    # Если build пропущен или красный, publish не запускается.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-build
          path: build

      # Ветка хранит только последнюю сборку: история архивов на мегабайты
      # в git никому не нужна.
      - name: Выложить в server-build
        working-directory: build
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b server-build
          git add pion-site.tar.gz pion-pay.tar.gz build-info.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Сборка ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" server-build
