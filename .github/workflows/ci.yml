name: Проверка сборки

# Публикация на GitHub Pages убрана: сайт живёт на pionperm.ru, а копия на
# github.io конкурировала с ним в выдаче за одни и те же страницы. Здесь
# остался только прогон тестов и сборки — чтобы сломанный код было видно сразу,
# а не при выкладке на боевой сервер.

# master проверяет и выкладывает deploy.yml — здесь ветки и pull request.
on:
  push:
    branches-ignore: [master, server-build]
  pull_request:
  workflow_dispatch:

# Здесь только проверки и ничего не публикуется, так что токену хватает чтения.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Токен не остаётся в .git/config, и скрипты npm его не найдут.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm test

      # PHP — та же версия, что на хостинге. Сначала синтаксис всех файлов,
      # которые уезжают на сервер, потом проверки выкладки.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - run: find server-pay wp-theme -name '*.php' -print0 | xargs -0 -n1 php -l

      - run: php tests/php/run.php

      # Боевая сборка. Шаг postbuild проверяет, что canonical, og, Schema и
      # sitemap указывают на pionperm.ru, и роняет сборку, если нет.
      - run: npm run build

  # Хостинг — AlmaLinux 8 с SQLite 3.26: свежая SQLite на ubuntu-latest не
  # заметит SQL новее 3.26. Здесь те же проверки — на той же ОС и той же SQLite.
  php-sqlite326:
    runs-on: ubuntu-latest
    container: almalinux:8
    steps:
      - run: |
          dnf -y -q module enable php:8.2
          dnf -y -q install php-cli php-pdo php-gd php-mbstring git tar gzip
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: SQLite — та же, что на хостинге
        run: |
          php -r 'echo SQLite3::version()["versionString"], PHP_EOL;' | tee /dev/stderr | grep -q '^3\.26\.'
      - run: php tests/php/run.php
